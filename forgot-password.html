<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>กู้คืนรหัสผ่าน - ร้านน้ำปั่นพี่ต้อม</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Floating Fruit Animation Background -->
  <canvas id="fruitCanvas" class="canvas-bg"></canvas>

  <div class="auth-container">
    <div class="glass-card auth-card">
      <h2 class="auth-title">กู้คืนรหัสผ่าน</h2>
      <p class="auth-subtitle neon-text-cyan">กู้คืนรหัสผ่านของระบบสมาชิกสะสมแต้ม</p>

      <div id="errorBox" style="color: var(--accent-red); background: rgba(255, 56, 96, 0.1); border: 1px solid var(--accent-red); padding: 10px; border-radius: 8px; margin-bottom: 16px; display: none; font-size: 0.9rem; text-align: center;"></div>
      <div id="successBox" style="color: var(--accent-green); background: rgba(57, 255, 20, 0.1); border: 1px solid var(--accent-green); padding: 10px; border-radius: 8px; margin-bottom: 16px; display: none; font-size: 0.9rem; text-align: center;"></div>

      <!-- Step 1: Request Email -->
      <form id="forgotForm">
        <div class="form-group">
          <label class="form-label" for="emailInput">กรอกอีเมลสมาชิกของคุณ</label>
          <input class="form-input" type="email" id="emailInput" placeholder="example@gmail.com" required>
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px;">ตรวจสอบความถูกต้อง</button>
      </form>

      <!-- Step 2: Reset Password (Hidden Initially) -->
      <form id="resetForm" style="display: none;">
        <p style="margin-bottom: 16px; font-size: 0.95rem; color: var(--accent-green); text-align: center;">🛡️ ยืนยันอีเมลสำเร็จ! กรุณากรอกรหัสผ่านใหม่</p>
        <div class="form-group">
          <label class="form-label" for="newPasswordInput">รหัสผ่านใหม่</label>
          <input class="form-input" type="password" id="newPasswordInput" placeholder="อย่างน้อย 6 อักขระ" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="confirmNewPasswordInput">ยืนยันรหัสผ่านใหม่</label>
          <input class="form-input" type="password" id="confirmNewPasswordInput" placeholder="ยืนยันรหัสผ่านใหม่อีกครั้ง" required>
        </div>
        <button type="submit" class="btn btn-success" style="width: 100%; margin-top: 10px;">เปลี่ยนรหัสผ่าน</button>
      </form>

      <div style="margin-top: 24px; text-align: center; font-size: 0.9rem;">
        <a href="login.html" style="color: var(--text-sub); text-decoration: none;">ย้อนกลับไปหน้าเข้าสู่ระบบ</a>
      </div>
    </div>
  </div>

  <script src="db.js?v=3"></script>
  <script>
    // Redirect if already logged in
    if (DB.getCurrentUser()) {
      window.location.href = 'home.html';
    }

    const forgotForm = document.getElementById('forgotForm');
    const resetForm = document.getElementById('resetForm');
    const emailInput = document.getElementById('emailInput');
    const errorBox = document.getElementById('errorBox');
    const successBox = document.getElementById('successBox');
    
    let targetUser = null;

    // Email Check Handler
    forgotForm.addEventListener('submit', (e) => {
      e.preventDefault();
      errorBox.style.display = 'none';
      
      const emailVal = emailInput.value.toLowerCase().trim();
      const users = DB.getUsers();
      targetUser = users.find(u => u.email.toLowerCase() === emailVal);

      if (!targetUser) {
        errorBox.textContent = 'ไม่พบที่อยู่อีเมลนี้ในระบบสมาชิก';
        errorBox.style.display = 'block';
        return;
      }

      // Success, shift to step 2
      forgotForm.style.display = 'none';
      resetForm.style.display = 'block';
    });

    // Reset Password Handler
    resetForm.addEventListener('submit', (e) => {
      e.preventDefault();
      errorBox.style.display = 'none';
      successBox.style.display = 'none';

      const newPass = document.getElementById('newPasswordInput').value;
      const confirmNewPass = document.getElementById('confirmNewPasswordInput').value;

      if (newPass.length < 6) {
        errorBox.textContent = 'รหัสผ่านต้องมีความยาวอย่างน้อย 6 ตัวอักษร';
        errorBox.style.display = 'block';
        return;
      }

      if (newPass !== confirmNewPass) {
        errorBox.textContent = 'รหัสผ่านใหม่สองตัวไม่ตรงกัน';
        errorBox.style.display = 'block';
        return;
      }

      try {
        const users = DB.getUsers();
        const userIdx = users.findIndex(u => u.username === targetUser.username);
        if (userIdx === -1) throw new Error('เกิดข้อผิดพลาดในการระบุข้อมูลผู้ใช้');

        users[userIdx].passwordHash = newPass;
        DB.saveUsers(users);
        DB.logActivity(targetUser.username, 'กู้คืนรหัสผ่าน', 'แก้ไขรหัสผ่านใหม่ผ่านระบบกู้คืนรหัสผ่านสำเร็จ');

        successBox.textContent = 'เปลี่ยนรหัสผ่านสำเร็จเรียบร้อย! กำลังนำคุณไปหน้าเข้าสู่ระบบ...';
        successBox.style.display = 'block';
        resetForm.reset();

        setTimeout(() => {
          window.location.href = 'login.html';
        }, 2000);
      } catch (err) {
        errorBox.textContent = err.message;
        errorBox.style.display = 'block';
      }
    });

    // Canvas animation code
    const canvas = document.getElementById('fruitCanvas');
    const ctx = canvas.getContext('2d');
    let fruits = [];
    const emojiList = ['🍓', '🥑', '🥭', '🥥', '🍉', '🍍', '🍊', '🍌'];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class FloatingFruit {
      constructor() {
        this.x = Math.random() * canvas.width;
        this.y = canvas.height + Math.random() * 100;
        this.size = Math.random() * 20 + 20;
        this.speed = Math.random() * 1.5 + 0.5;
        this.emoji = emojiList[Math.floor(Math.random() * emojiList.length)];
        this.opacity = Math.random() * 0.5 + 0.15;
        this.angle = Math.random() * Math.PI * 2;
        this.angularSpeed = (Math.random() - 0.5) * 0.02;
      }
      update() {
        this.y -= this.speed;
        this.angle += this.angularSpeed;
        if (this.y < -50) {
          this.y = canvas.height + 50;
          this.x = Math.random() * canvas.width;
        }
      }
      draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.angle);
        ctx.globalAlpha = this.opacity;
        ctx.font = `${this.size}px sans-serif`;
        ctx.fillText(this.emoji, -this.size/2, this.size/2);
        ctx.restore();
      }
    }

    for (let i = 0; i < 25; i++) {
      fruits.push(new FloatingFruit());
    }

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      fruits.forEach(f => {
        f.update();
        f.draw();
      });
      requestAnimationFrame(animate);
    }
    animate();
  </script>
</body>
</html>
