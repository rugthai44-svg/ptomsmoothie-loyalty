<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เข้าสู่ระบบ - ร้านน้ำปั่นพี่ต้อม</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <!-- Floating Fruit Animation Background -->
  <canvas id="fruitCanvas" class="canvas-bg"></canvas>

  <div class="auth-container">
    <div class="glass-card auth-card">
      <div style="text-align: center; margin-bottom: 20px;">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="48" height="48" fill="#00f0ff"
          style="filter: drop-shadow(0 0 8px #00f0ff);">
          <path
            d="M12 2c1.2 0 2.3.4 3.2 1.2l-1.4 1.4C13.2 4.2 12.6 4 12 4c-3.9 0-7 3.1-7 7 0 2.5 1.3 4.7 3.2 6H5.4c-1.9-1.3-3.2-3.5-3.2-6 0-5 4-9 9-9zm0 18c-3.9 0-7-3.1-7-7H3c0 5 4 9 9 9s9-4 9-9h-2c0 3.9-3.1 7-7 7zm5.2-13.8l-1.4 1.4c.8.9 1.2 2 1.2 3.2v5.4c0 1.9-1.3 3.5-3.2 4.8v2.1c3.1-1.3 5.2-4.1 5.2-7.5V11.4c0-1.8-.7-3.5-1.8-4.8zM12 7c-2.2 0-4 1.8-4 4s1.8 4 4 4 4-1.8 4-4-1.8-4-4-4z" />
        </svg>
      </div>
      <h2 class="auth-title">ร้านน้ำปั่นพี่ต้อม</h2>
      <p class="auth-subtitle neon-text-cyan">ระบบสะสมแต้มอัจฉริยะ Loyalty Program</p>

      <div id="errorBox"
        style="color: var(--accent-red); background: rgba(255, 56, 96, 0.1); border: 1px solid var(--accent-red); padding: 10px; border-radius: 8px; margin-bottom: 16px; display: none; font-size: 0.9rem; text-align: center;">
      </div>

      <form id="loginForm">
        <div class="form-group">
          <label class="form-label" for="usernameInput">ชื่อผู้ใช้ หรือ อีเมล</label>
          <input class="form-input" type="text" id="usernameInput" placeholder="กรอกชื่อผู้ใช้ หรือ อีเมล" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="passwordInput">รหัสผ่าน</label>
          <div class="password-wrapper">
            <input class="form-input" type="password" id="passwordInput" placeholder="กรอกรหัสผ่าน" required>
            <button type="button" class="password-toggle" id="togglePassword">👁️</button>
          </div>
        </div>

        <div class="form-group"
          style="display: flex; align-items: center; gap: 8px; margin-top: -10px; margin-bottom: 16px;">
          <input type="checkbox" id="rememberMeInput"
            style="width: 16px; height: 16px; accent-color: var(--accent-cyan); cursor: pointer;">
          <label for="rememberMeInput"
            style="color: var(--text-sub); font-size: 0.85rem; cursor: pointer; user-select: none;">จดจำข้อมูลการเข้าสู่ระบบ</label>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; font-size: 1.05rem;">เข้าสู่ระบบ</button>
      </form>

      <div style="margin-top: 24px; text-align: center; font-size: 0.9rem;">
        <p style="color: var(--text-sub);">ยังไม่มีบัญชีสมาชิก? <a href="create-account.html"
            style="color: var(--accent-cyan); text-decoration: none; font-weight: 600;">สมัครสมาชิกใหม่</a></p>
        <p style="margin-top: 8px;"><a href="forgot-password.html"
            style="color: var(--text-sub); text-decoration: none; font-size: 0.85rem;">ลืมรหัสผ่านใช่หรือไม่?</a></p>
        <p style="margin-top: 20px; border-top: 1px solid var(--border-color); padding-top: 16px;">
          <a href="admin-login.html"
            style="color: var(--text-sub); text-decoration: none; font-size: 0.85rem; display: inline-flex; align-items: center; gap: 4px;">
            🛡️ ระบบแอดมินหลังบ้าน
          </a>
        </p>
      </div>
    </div>
  </div>

  <script src="db.js"></script>
  <script>
    // Redirect if already logged in
    if (DB.getCurrentUser()) {
      window.location.href = 'home.html';
    }

    // Autocomplete remembered credentials
    const rememberedCustomer = localStorage.getItem('ptom_remember_customer');
    if (rememberedCustomer) {
      const data = JSON.parse(rememberedCustomer);
      document.getElementById('usernameInput').value = data.usernameOrEmail;
      document.getElementById('passwordInput').value = data.password;
      document.getElementById('rememberMeInput').checked = true;
    }

    // Toggle Password Visibility
    const togglePasswordBtn = document.getElementById('togglePassword');
    const passwordInput = document.getElementById('passwordInput');
    togglePasswordBtn.addEventListener('click', () => {
      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        togglePasswordBtn.textContent = '🙈';
      } else {
        passwordInput.type = 'password';
        togglePasswordBtn.textContent = '👁️';
      }
    });

    // Form Submit Handler
    const loginForm = document.getElementById('loginForm');
    const errorBox = document.getElementById('errorBox');

    loginForm.addEventListener('submit', (e) => {
      e.preventDefault();
      errorBox.style.display = 'none';

      const username = document.getElementById('usernameInput').value;
      const pass = passwordInput.value;
      const rememberMe = document.getElementById('rememberMeInput').checked;

      try {
        DB.login(username, pass);

        if (rememberMe) {
          localStorage.setItem('ptom_remember_customer', JSON.stringify({
            usernameOrEmail: username,
            password: pass
          }));
        } else {
          localStorage.removeItem('ptom_remember_customer');
        }

        window.location.href = 'home.html';
      } catch (err) {
        errorBox.textContent = err.message;
        errorBox.style.display = 'block';
      }
    });

    // Canvas Floating Fruits Animation
    const canvas = document.getElementById('fruitCanvas');
    const ctx = canvas.getContext('2d');

    let fruits = [];
    const emojiList = ['🍓', '🥑', '🥭', '🥥', '🍉', '🍍', '🍊', '🍌'];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class FloatingFruit {
      constructor() {
        this.x = Math.random() * canvas.width;
        this.y = canvas.height + Math.random() * 100;
        this.size = Math.random() * 20 + 20;
        this.speed = Math.random() * 1.5 + 0.5;
        this.emoji = emojiList[Math.floor(Math.random() * emojiList.length)];
        this.opacity = Math.random() * 0.5 + 0.15;
        this.angle = Math.random() * Math.PI * 2;
        this.angularSpeed = (Math.random() - 0.5) * 0.02;
      }
      update() {
        this.y -= this.speed;
        this.angle += this.angularSpeed;
        if (this.y < -50) {
          this.y = canvas.height + 50;
          this.x = Math.random() * canvas.width;
        }
      }
      draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.angle);
        ctx.globalAlpha = this.opacity;
        ctx.font = `${this.size}px sans-serif`;
        ctx.fillText(this.emoji, -this.size / 2, this.size / 2);
        ctx.restore();
      }
    }

    for (let i = 0; i < 25; i++) {
      fruits.push(new FloatingFruit());
    }

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      fruits.forEach(f => {
        f.update();
        f.draw();
      });
      requestAnimationFrame(animate);
    }
    animate();
  </script>
</body>

</html>
